<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no"/>
<title>Windows 10 Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
body{width:100vw;height:100vh;overflow:hidden}
/*开机画面*/
#boot{position:fixed;inset:0;background:#0078d4;z-index:99999;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.loader{width:40px;height:40px;border:4px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#desktop{width:100%;height:calc(100% - 40px);background:url('') #0078d4;position:relative;display:none}
.wallpaper{position:absolute;inset:0;background:linear-gradient(145deg,#0078d4,#1a4b8c)}
/*桌面图标*/
.d-icon{width:72px;text-align:center;position:absolute;cursor:pointer;color:#fff}
.d-icon .ico{font-size:34px}
.d-icon .name{font-size:12px;margin-top:3px;text-shadow:0 0 3px #000}
/*任务栏*/
#taskbar{height:40px;background:#1c1c1c;position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;padding:0 4px;z-index:9999}
#startBtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;border-radius:2px}
#startBtn:hover{background:#333}
.t-space{flex-grow:1}
#tray{color:#fff;font-size:12px;padding:0 8px}
/*开始菜单*/
#startMenu{position:absolute;bottom:40px;left:0;width:580px;height:520px;background:#1f1f1f;display:none;z-index:9998;padding:10px}
.app-item{color:#fff;padding:6px 10px;border-radius:3px;cursor:pointer;margin:2px 0}
.app-item:hover{background:#383838}
/*窗口*/
.win{position:absolute;width:600px;height:360px;background:#fff;box-shadow:0 4px 22px #0006;display:flex;flex-direction:column;overflow:hidden;z-index:100}
.win-title{height:30px;background:#0078d4;color:#fff;display:flex;align-items:center;padding:0 8px}
.win-title-text{flex:1;font-size:13px}
.win-ctrl{display:flex}
.win-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.win-btn:hover{background:rgba(255,255,255,0.2)}
.win-body{flex:1;overflow:auto;padding:8px;font-size:14px}
textarea{width:100%;height:100%;border:none;outline:none;padding:6px;font-size:14px}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:4px}
</style>
</head>
<body>
<div id="boot">
  <div style="text-align:center">
    <div class="loader"></div>
    <div>正在启动 Windows</div>
  </div>
</div>

<div id="desktop">
  <div class="wallpaper"></div>
  <div class="d-icon" style="left:12px;top:12px" data-app="pc">
    <div class="ico">💻</div>
    <div class="name">此电脑</div>
  </div>
  <div class="d-icon" style="left:12px;top:92px" data-app="edge">
    <div class="ico">🌐</div>
    <div class="name">Microsoft Edge</div>
  </div>
  <div class="d-icon" style="left:12px;top:172px" data-app="notepad">
    <div class="ico">📄</div>
    <div class="name">记事本</div>
  </div>
  <div class="d-icon" style="left:12px;top:252px" data-app="calc">
    <div class="ico">🔢</div>
    <div class="name">计算器</div>
  </div>
  <div class="d-icon" style="left:12px;top:332px" data-app="paint">
    <div class="ico">🎨</div>
    <div class="name">画图</div>
  </div>
</div>

<div id="taskbar">
  <div id="startBtn">⊞</div>
  <div class="t-space"></div>
  <div id="tray">00:00</div>
</div>

<div id="startMenu">
  <div class="app-item" data-app="pc">💻 此电脑</div>
  <div class="app-item" data-app="edge">🌐 Microsoft Edge</div>
  <div class="app-item" data-app="notepad">📄 记事本</div>
  <div class="app-item" data-app="calc">🔢 计算器</div>
  <div class="app-item" data-app="paint">🎨 画图</div>
  <div class="app-item" id="shut">⏻ 关机</div>
</div>

<script>
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);
const boot = $("#boot");
const desktop = $("#desktop");
const startBtn = $("#startBtn");
const startMenu = $("#startMenu");
const tray = $("#tray");

//开机动画
setTimeout(()=>{
  boot.style.display="none";
  desktop.style.display="block";
},2200)

//时钟
function updateClock(){
  let d=new Date();
  let h=d.getHours().toString().padStart(2,'0');
  let m=d.getMinutes().toString().padStart(2,'0');
  tray.innerText = `${h}:${m}`;
}
setInterval(updateClock,1000);
updateClock();

//开始菜单
startBtn.onclick = ()=>{
  startMenu.style.display = startMenu.style.display === "block" ? "none" : "block";
}
desktop.onclick = ()=>startMenu.style.display="none";

//新建窗口
function openWin(title,html){
  const w = document.createElement("div");
  w.className="win";
  w.innerHTML = `
    <div class="win-title">
      <div class="win-title-text">${title}</div>
      <div class="win-ctrl">
        <div class="win-btn close">×</div>
      </div>
    </div>
    <div class="win-body">${html}</div>
  `;
  desktop.appendChild(w);
  w.querySelector(".close").onclick = ()=>w.remove();
  //拖拽
  let drag=false,ox,oy;
  const bar = w.querySelector(".win-title");
  bar.onmousedown=e=>{
    drag=true;
    ox = e.clientX - w.offsetLeft;
    oy = e.clientY - w.offsetTop;
  }
  document.onmousemove=e=>{
    if(!drag)return;
    w.style.left = (e.clientX - ox)+"px";
    w.style.top = (e.clientY - oy)+"px";
  }
  document.onmouseup=()=>drag=false;
}

//绑定应用
$$(".d-icon,.app-item").forEach(el=>{
  el.onclick=()=>{
    startMenu.style.display="none";
    const app=el.dataset.app;
    switch(app){
      case "pc":
        openWin("此电脑","<table><tr><th>名称</th><th>类型</th></tr><tr><td>本地磁盘 (C:)</td><td>硬盘</td></tr><tr><td>本地磁盘 (D:)</td><td>硬盘</td></tr></table>");
        break;
      case "edge":
        openWin("Microsoft Edge","<p>网页浏览器（模拟）</p><p>输入网址访问页面</p>");
        break;
      case "notepad":
        openWin("记事本","<textarea placeholder="在这里输入文字..."></textarea>");
        break;
      case "calc":
        openWin("计算器","<p>1+1=2</p><p>简易模拟计算器</p>");
        break;
      case "paint":
        openWin("画图","<p>画图工具，模拟画板</p>");
        break;
    }
  }
})
$("#shut").onclick=()=>{
  boot.style.display="flex";
  desktop.style.display="none";
  boot.innerHTML="<div style='text-align:center'><div>正在关机</div></div>";
}
</script>
</body>
</html>
